{% extends 'base.html' %}
{% block titulo %}Acceso denegado{% endblock %}
{% block contenido %}
<div class="container-fluid px-4">
  <div class="app-card" style="max-width:560px; margin:4rem auto;">
    <div class="app-card-body" style="text-align:center; padding:2.5rem 2rem;">
      <span class="kpi-card-icon is-danger" style="width:56px;height:56px;font-size:1.4rem;margin:0 auto 1rem;"><i class="fas fa-lock"></i></span>
      <h2 class="page-header-title" style="margin-bottom:.5rem;">Acceso denegado</h2>
      <p class="page-header-subtitle" style="margin-bottom:1.5rem;">{{ mensaje }}</p>
      <p class="kpi-card-sub">Si necesitás este permiso, pedile a un administrador que lo habilite para tu perfil.</p>
      <a href="{{ url_for('dashmod.dashboard') }}" class="btn-app btn-app-primary mt-2"><i class="fas fa-home"></i> Volver al inicio</a>
    </div>
  </div>
</div>
{% endblock %}
