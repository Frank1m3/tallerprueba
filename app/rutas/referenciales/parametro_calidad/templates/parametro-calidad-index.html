{% extends 'base.html' %}
{% block titulo %}Parámetros de Control de Calidad{% endblock %}
{% block contenido %}
<div class="container-fluid mt-4">
    <h3>Listar Parámetros de Control de Calidad</h3>
    <div class="card">
      <div class="card-header"><button type="button" class="btn btn-primary" id="btnAgregar">Agregar</button></div>
      <div class="card-body">
        <table class="table table-striped" id="tbl" style="width:100%">
          <thead><tr><th>ID</th><th>Parámetro</th><th>Etapa</th><th>Mín.</th><th>Máx.</th><th>Unidad</th><th>Acciones</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <div class="modal" id="modalFormulario" tabindex="-1" role="dialog" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg" role="document"><div class="modal-content">
        <div class="modal-header"><h4 class="modal-title" id="modalTitle"></h4>
          <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span></button></div>
        <div class="modal-body">
          <input type="hidden" id="txtId">
          <div class="form-group">
            <label for="txtDescripcion">Parámetro (qué se mide):</label>
            <input type="text" class="form-control" placeholder="Ej. Temperatura, Peso, Humedad" id="txtDescripcion" autocomplete="off">
          </div>
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="cmbEtapa">Etapa:</label>
              <select class="form-control" id="cmbEtapa"></select>
            </div>
            <div class="form-group col-md-6">
              <label for="cmbUnidad">Unidad de medida:</label>
              <select class="form-control" id="cmbUnidad"></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="txtMin">Valor mínimo:</label>
              <input type="number" step="0.01" class="form-control" id="txtMin" autocomplete="off">
            </div>
            <div class="form-group col-md-6">
              <label for="txtMax">Valor máximo:</label>
              <input type="number" step="0.01" class="form-control" id="txtMax" autocomplete="off">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="btnGuardar">Guardar</button>
          <button type="button" class="btn btn-danger" data-dismiss="modal">Cerrar</button></div>
      </div></div>
    </div>
</div>
{% endblock %}
{% block js %}
<script>
  const API = '/api/v1/parametro_calidad';
  let combosCargados = false;
  const fmt = n => (n === null || n === undefined) ? '—' : Number(n).toLocaleString('es-PY');

  const initDatatable = () => {
    $('#tbl').DataTable({
      language: { url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}" },
      ajax: API,
      columns: [
        { data: 'id' },
        { data: 'descripcion' },
        { data: 'etapa_desc', defaultContent: '' },
        { data: 'valor_minimo', render: fmt },
        { data: 'valor_maximo', render: fmt },
        { data: 'unidad_desc', defaultContent: '' },
        { data: null, render: r => `<button type="button" name="btn_editar" class="btn btn-primary btn-sm mr-1" data-id="${r.id}">Editar</button><button type="button" name="btn_eliminar" class="btn btn-danger btn-sm" data-id="${r.id}">Eliminar</button>`, orderable:false, searchable:false }
      ],
      destroy: true
    });
  }

  const opciones = (lista, vacio) => {
    let html = `<option value="">${vacio}</option>`;
    lista.forEach(o => html += `<option value="${o.id}">${o.descripcion}</option>`);
    return html;
  }

  const cargarCombos = () => fetch(`${API}/combos`).then(r=>r.json()).then(d=>{
    if (d && d.success) {
      $('#cmbEtapa').html(opciones(d.data.etapas, '-- Seleccione --'));
      $('#cmbUnidad').html(opciones(d.data.unidades, '-- Seleccione --'));
      combosCargados = true;
    }
  });

  const limpiar = () => { $('#txtId').val(""); $('#txtDescripcion').val(""); $('#cmbEtapa').val(""); $('#cmbUnidad').val(""); $('#txtMin').val(""); $('#txtMax').val(""); };

  const payload = () => ({
    descripcion: $('#txtDescripcion').val().trim(),
    id_tipo_etapa: $('#cmbEtapa').val() || null,
    id_unidad_medida: $('#cmbUnidad').val() || null,
    valor_minimo: $('#txtMin').val() || null,
    valor_maximo: $('#txtMax').val() || null,
  });

  $('#btnAgregar').on('click', async () => {
    if (!combosCargados) await cargarCombos();
    $('#modalTitle').text("Agregar Parámetro"); limpiar(); $('#modalFormulario').modal('show');
  });

  $('#btnGuardar').on('click', function(){
    const id = $('#txtId').val(); const d = payload(); const tabla = $('#tbl').DataTable();
    if (!d.descripcion) { Swal.fire("Error","El parámetro es obligatorio.","warning"); return; }
    fetch(id ? `${API}/${id}` : API, { method: id?'PUT':'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(d) })
    .then(r=>r.json()).then(res=>{ if(res&&res.success){ tabla.ajax.reload(null,false); Swal.fire(id?"Actualizado":"Agregado","Parámetro guardado.","success"); } else { Swal.fire("Error", res.error||"Error.","error"); } })
    .catch(e=>{console.error(e);Swal.fire("Error","Ocurrió un error.","error");});
    $('#modalFormulario').modal("hide");
  });

  $('#tbl').on('click','button[name="btn_editar"]', async function(){
    const id = $(this).data('id');
    if (!combosCargados) await cargarCombos();
    fetch(`${API}/${id}`).then(r=>r.json()).then(res=>{
      if(res&&res.success){
        const d = res.data;
        $('#modalTitle').text("Editar Parámetro");
        $('#txtId').val(d.id);
        $('#txtDescripcion').val(d.descripcion||"");
        $('#cmbEtapa').val(d.id_tipo_etapa ?? "");
        $('#cmbUnidad').val(d.id_unidad_medida ?? "");
        $('#txtMin').val(d.valor_minimo ?? "");
        $('#txtMax').val(d.valor_maximo ?? "");
        $('#modalFormulario').modal('show');
      } else { Swal.fire("Error", res.error||"No se pudo obtener.","error"); }
    }).catch(e=>{console.error(e);Swal.fire("Error","Ocurrió un error.","error");});
  });

  $('#tbl').on('click','button[name="btn_eliminar"]', function(){
    const id = $(this).data('id');
    Swal.fire({title:"¿Deseas eliminar este registro?",icon:'warning',showCancelButton:true,confirmButtonText:"Sí",cancelButtonText:"No"}).then(res=>{
      if(res.isConfirmed){ fetch(`${API}/${id}`,{method:'DELETE',headers:{'Content-Type':'application/json'}}).then(r=>r.json()).then(d=>{ if(d&&d.success){ $('#tbl').DataTable().ajax.reload(null,false); Swal.fire("Eliminado","Parámetro eliminado.","success"); } else { Swal.fire("Error", d.error||"No se pudo eliminar.","error"); } }).catch(e=>{console.error(e);Swal.fire("Error","Ocurrió un error.","error");}); }
    });
  });

  $(document).ready(()=> initDatatable());
</script>
{% endblock %}
