{% extends 'base.html' %}

{% block titulo %}
Listar Pedidos de Compra
{% endblock %}

{% block contenido %}
<div class="container mt-4">
    <h3>Pedidos de Compra</h3>

    <!-- Tarjeta con tabla -->
    <div class="card shadow">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>Pedidos</span>
            <a href="{{ url_for('pdcmod.pedidos_agregar') }}" class="btn btn-primary btn-sm" target="_blank">
                Agregar Pedido
            </a>
        </div>
        <div class="card-body">
            <table class="table table-striped table-bordered" id="tbl_pedidos">
                <thead>
                    <tr>
                        <th>ID Pedido</th>
                        <th>N° Pedido</th>
                        <th>Fecha</th>
                        <th>Sucursal</th>
                        <th>Funcionario</th>
                        <th>Depósito</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Alerta -->
    <div class="row mt-4 d-none" id="rowAlerta">
        <div class="col-md-12">
            <div class="alert alert-success">
                <strong>Registro Exitoso!</strong>
                <div class="row" id="mostrarAlerta"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
$(document).ready(function(){

    // Inicializar DataTable
    const tabla = $('#tbl_pedidos').DataTable({
        language: {
            url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}"
        },
        ajax: {
            url: '/api/v1/gestionar-compras/registrar-pedido-compras/pedidos',
            dataSrc: 'data'
        },
        columns: [
            { data: 'id_pedido_compra_cab' },
            { data: 'nro_pedido' },
            { data: 'fecha_pedido' },
            { data: 'sucursal' },
            { data: 'funcionario' },
            { data: 'deposito' },
            {
                data: 'estado',
                render: function(estado){
                    const map = { PENDIENTE:'warning', APROBADO:'success', ANULADO:'secondary' };
                    return `<span class="badge badge-${map[estado] || 'secondary'}">${estado || '-'}</span>`;
                }
            },
            {
                data: null,
                orderable: false,
                className: 'text-center',
                render: function(row){
                    return '<button class="btn btn-info btn-sm ver" data-id="' + row.id_pedido_compra_cab + '">Ver</button> ' +
                           '<button class="btn btn-warning btn-sm editar" data-id="' + row.id_pedido_compra_cab + '">Editar</button> ' +
                           '<button class="btn btn-outline-secondary btn-sm btn-cambiar-estado" data-id="' + row.id_pedido_compra_cab + '" data-estado="' + row.estado + '">Cambiar estado</button>';
                }
            }
        ],
        order: [[0, 'desc']]
    });

    // ---------------- Eventos botones ----------------

    // Ver detalle
    $('#tbl_pedidos').on('click', '.ver', function(){
        const id = $(this).data('id');
        // Construir la URL directamente con el ID para evitar ValueError
        window.open('/gestionar-compras/registrar-pedido-compras/pedidos/detalle/' + id, '_blank');
    });

    // Editar pedido
    $('#tbl_pedidos').on('click', '.editar', function(){
        const id = $(this).data('id');
        window.open('/gestionar-compras/registrar-pedido-compras/editar/' + id, '_blank');
    });

    // Cambiar estado (libre; incluye ANULADO, así que reemplaza al viejo "Eliminar")
    const ESTADOS = ['PENDIENTE', 'APROBADO', 'ANULADO'];
    $('#tbl_pedidos').on('click', '.btn-cambiar-estado', function(){
        const id = $(this).data('id');
        const estadoActual = $(this).data('estado');
        const opciones = ESTADOS.map(e => `<option value="${e}" ${e===estadoActual?'selected':''}>${e}</option>`).join('');
        Swal.fire({
            title: 'Cambiar estado',
            width: 320,
            padding: '1rem',
            html: `<select id="swal_nuevo_estado" class="swal2-select" style="display:block;width:100%;margin:0;padding:.4rem;font-size:.85rem;border-radius:6px;border:1px solid #d1d5db">${opciones}</select>`,
            showCancelButton: true,
            confirmButtonText: 'Guardar',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#1a56db',
            preConfirm: () => document.getElementById('swal_nuevo_estado').value
        }).then(r => {
            if(!r.isConfirmed) return;
            const nuevoEstado = r.value;
            if(nuevoEstado === estadoActual) return;
            fetch(`/api/v1/gestionar-compras/registrar-pedido-compras/pedidos/${id}/estado`, {
                method: 'PUT',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ estado: nuevoEstado })
            })
            .then(r => r.json())
            .then(data => {
                if(data.success){
                    tabla.ajax.reload(null, false);
                    Swal.fire({ title:'Listo', text:'El estado fue actualizado.', icon:'success', timer:1800, showConfirmButton:false });
                } else {
                    Swal.fire('Error', data.error || 'No se pudo cambiar el estado', 'error');
                }
            })
            .catch(() => Swal.fire('Error','Ocurrió un error al cambiar el estado.','error'));
        });
    });

});
</script>


{% endblock %}
