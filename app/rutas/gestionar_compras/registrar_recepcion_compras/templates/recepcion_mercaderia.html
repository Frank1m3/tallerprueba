{% extends 'base.html' %}

{% block titulo %}Recepción de Mercaderías{% endblock %}

{% block contenido %}
<div class="container mt-4" style="max-width:1200px;">
    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <strong>Recepción de Mercaderías — Orden de Compra</strong>
            <div>
                <button class="btn btn-sm btn-primary" id="btnNuevo" onclick="nuevo()">Nuevo</button>
                <button class="btn btn-sm btn-success" id="btnGrabar" onclick="grabar()" disabled>Grabar</button>
                <button class="btn btn-sm btn-secondary" id="btnCancelar" onclick="cancelar()" disabled>Cancelar</button>
                <button class="btn btn-sm btn-secondary" id="btnSalir" onclick="location.href='/'">Salir</button>
            </div>
        </div>

        <div class="card-body">
            <div class="row mb-3">
                <div class="col-md-3">
                    <label>Número de Orden (OC)</label>
                    <input type="text" id="txt_nro_orden" class="form-control" disabled placeholder="Ej: OC-000001">
                </div>
                <div class="col-md-3">
                    <label>Proveedor</label>
                    <input type="text" id="txt_proveedor" class="form-control" readonly>
                </div>
                <div class="col-md-3">
                    <label>Fecha Emisión OC</label>
                    <input type="text" id="txt_fecha_emision" class="form-control" readonly>
                </div>
                <div class="col-md-3">
                    <label>Funcionario Receptor</label>
                    <select id="cbo_funcionario" class="form-control" disabled>
                        <option value="">Seleccione</option>
                        {% for f in funcionarios %}
                        <option value="{{ f.fun_id }}">{{ f.nombre_completo }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-3">
                    <label>Código Ítem</label>
                    <input type="text" id="txt_codigo" class="form-control" disabled>
                </div>
                <div class="col-md-4">
                    <label>Descripción</label>
                    <input type="text" id="txt_descripcion" class="form-control" readonly>
                </div>
                <div class="col-md-2">
                    <label>Cant. Pendiente</label>
                    <input type="text" id="txt_cant_pedida" class="form-control" readonly>
                </div>
                <div class="col-md-2">
                    <label>Cant. Recibida</label>
                    <input type="number" id="txt_cant_recibida" class="form-control" disabled min="0" step="0.01">
                </div>
                <div class="col-md-1 d-flex align-items-end">
                    <button class="btn btn-success w-100" id="btnAgregar" disabled>+</button>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-12">
                    <table id="tbl_detalle" class="table table-bordered text-center align-middle">
                        <thead class="thead-dark">
                            <tr>
                                <th>#</th>
                                <th>Código</th>
                                <th>Descripción</th>
                                <th>Cant. Pendiente</th>
                                <th>Cant. Recibida</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
